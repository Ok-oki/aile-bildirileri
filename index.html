<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İldoşumla Aşk Menüsü</title>
  <style>
    body {
      background: linear-gradient(to right, #ffccd5, #ffe6f0);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      text-align: center;
      padding: 50px;
      color: #880e4f;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 20px;
    }
    button {
      display: block;
      width: 300px;
      margin: 15px auto;
      padding: 15px;
      font-size: 1.2em;
      background-color: #f06292;
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #ec407a;
    }
    #result {
      margin-top: 30px;
      font-size: 1.2em;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>İldoşum için <3 Aşk Menüsü</h1>
  <button onclick="toggleSubMenu()">Aşk İçin Tıkla</button>

  <div id="subMenu" style="display:none">
    <button onclick="calculateLoveDuration()">Ne Kadar Zamandır Sevgiliyiz?</button>
    <button onclick="calculateDistanceDuration()">Birbirimizden Ne Kadar Süredir Uzağız?</button>
    <button onclick="countLoveMessages()">Kaç Kere 'Seni Seviyorum' Dedik?</button>
    <button onclick="firstHoldingHands()">İlk El Ele Tutuştuğumuz An</button>
  </div>

  <div id="result"></div>

  <script>
    function toggleSubMenu() {
      const subMenu = document.getElementById('subMenu');
      subMenu.style.display = subMenu.style.display === 'none' ? 'block' : 'none';
    }

    function calculateLoveDuration() {
      const startDate = new Date("2024-03-15T00:00:00");
      const now = new Date();
      const diff = now - startDate;
      const seconds = Math.floor(diff / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);
      const days = Math.floor(hours / 24);
      const weeks = Math.floor(days / 7);
      const months = Math.floor(days / 30.44);
      const years = Math.floor(days / 365.25);

      const result = `İldoşumla tam tamına:\n
      ${years} yıl,\n      ${months % 12} ay,\n      ${weeks % 4} hafta,\n      ${(days % 7)} gün,\n      ${(hours % 24)} saat,\n      ${(minutes % 60)} dakika,\n      ${(seconds % 60)} saniyedir sevgiliyiz! ❤️`;

      document.getElementById('result').innerText = result;
    }

    function calculateDistanceDuration() {
      const startDistanceDate = new Date("2025-05-10T08:00:00");
      const now = new Date();
      const diff = now - startDistanceDate;
      const seconds = Math.floor(diff / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);
      const days = Math.floor(hours / 24);

      const result = `Sen Kepez'desin, ben Pendaya'da... 💔\n
      Aramızda tam 280 km var ve:\n      ${days} gün,\n      ${(hours % 24)} saat,\n      ${(minutes % 60)} dakika,\n      ${(seconds % 60)} saniyedir ayrıyız... 💌`;

      document.getElementById('result').innerText = result;
    }

    function countLoveMessages() {
      const count = 3473;
      const result = `WhatsApp verilerine göre tamı tamına ${count} kez \"Seni Seviyorum\" dedik! 🥰\n
      Her bir kelimesi kalbime dokundu İldoşum...`;

      document.getElementById('result').innerText = result;
    }

    function firstHoldingHands() {
      const result = `15 Mart gecesi, \"Evet mi Hayır mı\" tiyatrosunda...\n
      Kalbim heyecanla atarken elini tuttum.\n
      O an dünya durdu sanki... Çok heyecanlı, çok büyülüydü İldoşum! 🎭❤️`;

      document.getElementById('result').innerText = result;
    }
  </script>
</body>
</html>
