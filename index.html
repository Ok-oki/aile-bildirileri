<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>İldoşumla Aşkımız</title>
  <style>
    body {
      background: linear-gradient(to bottom right, #ffccff, #ffe6f0);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      text-align: center;
      color: #d10068;
      padding: 20px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 10px;
    }

    .menu-button {
      background: hotpink;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 25px;
      font-size: 1.3em;
      margin: 10px;
      cursor: pointer;
      box-shadow: 0 0 10px pink;
      transition: transform 0.2s;
    }

    .menu-button:hover {
      transform: scale(1.05);
      background: deeppink;
    }

    .hidden {
      display: none;
      margin-top: 20px;
    }

    .result-box {
      background: #fff0f5;
      border-radius: 15px;
      padding: 20px;
      display: inline-block;
      box-shadow: 0 0 10px pink;
      margin-top: 20px;
    }

    .images {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }

    .images img {
      width: 300px;
      border: 4px solid pink;
      border-radius: 20px;
      box-shadow: 0 0 15px hotpink;
      transition: transform 0.3s;
    }

    .images img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <h1>💖 İldoşumla Aşkımız 💖</h1>

  <button class="menu-button" onclick="toggleMenu()">Aşk için tıkla 💌</button>

  <div id="menu" class="hidden">
    <button class="menu-button" onclick="showLoveDuration()">Ne kadar zamandır sevgiliyiz?</button>
    <button class="menu-button" onclick="showDistance()">Birbirimizden uzaklığımız</button>
    <button class="menu-button" onclick="showMessageCount()">Kaç kere 'Seni Seviyorum' dedik?</button>
    <button class="menu-button" onclick="showFirstTouch()">İlk el ele tutuştuğumuz an 💫</button>
  </div>

  <div id="output" class="result-box hidden"></div>

  <div class="images">
    <img src="ask.jpg" alt="İldoşum ve Ben">
    <img src="ask2.png" alt="İkimizin Kalbi">
  </div>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('menu');
      menu.classList.toggle('hidden');
    }

    function showLoveDuration() {
      const startDate = new Date("2024-03-15T00:00:00");
      const now = new Date();
      const diff = now - startDate;

      const years = Math.floor(diff / (1000 * 60 * 60 * 24 * 365));
      const months = Math.floor(diff / (1000 * 60 * 60 * 24 * 30.4375));
      const weeks = Math.floor(diff / (1000 * 60 * 60 * 24 * 7));
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor(diff / (1000 * 60 * 60));
      const minutes = Math.floor(diff / (1000 * 60));
      const seconds = Math.floor(diff / 1000);

      const output = document.getElementById('output');
      output.classList.remove('hidden');
      output.innerHTML = `
        <h2>👩‍❤️‍👨 Aşkımızın Süresi</h2>
        <p><strong>${years}</strong> yıl, <strong>${months}</strong> ay, <strong>${weeks}</strong> hafta,</p>
        <p><strong>${days}</strong> gün, <strong>${hours}</strong> saat, <strong>${minutes}</strong> dakika,</p>
        <p><strong>${seconds}</strong> saniyedir birlikteyiz İldoşum! 💖</p>
      `;
    }

    function showDistance() {
      const startDate = new Date("2025-05-10T08:00:00");
      const now = new Date();
      const diff = now - startDate;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      const output = document.getElementById('output');
      output.classList.remove('hidden');
      output.innerHTML = `
        <h2>📍 Uzaklığımız</h2>
        <p>Kepez'den Pendaya'ya olan 280 km'lik mesafede,</p>
        <p><strong>${days}</strong> gün <strong>${hours}</strong> saat <strong>${minutes}</strong> dakika <strong>${seconds}</strong> saniyedir</p>
        <p>seni daha çok özlüyorum İldoşum... 💭💕</p>
      `;
    }

    function showMessageCount() {
      const output = document.getElementById('output');
      output.classList.remove('hidden');
      output.innerHTML = `
        <h2>💬 'Seni Seviyorum' Mesajlarımız</h2>
        <p>WhatsApp üzerinden tam <strong>3.473</strong> kez seni sevdiğimi söyledim.</p>
        <p>Yetmez... daha milyonlarca kez söyleyeceğim İldoşum! 💗</p>
      `;
    }

    function showFirstTouch() {
      const output = document.getElementById('output');
      output.classList.remove('hidden');
      output.innerHTML = `
        <h2>🤝 İlk El Ele Tutuşmamız</h2>
        <p>15 Mart gecesi... "Evet mi, Hayır mı?" tiyatrosunda ellerimiz buluştu.</p>
        <p>Çok heyecanlı, çok büyülü bir andı. Kalbim o an sadece sana attı İldoşum... 🌙🎭</p>
      `;
    }
  </script>

</body>
</html>
